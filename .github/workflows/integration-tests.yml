name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Tui Test Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: tests/clvgr.IntegrationTests/TuiTest.dockerfile
        load: true
        tags: clvgr-tui-test:latest

    - name: Build Integration Tests Project
      run: dotnet build tests/clvgr.IntegrationTests/clvgr.IntegrationTests.csproj -c Release

    - name: Run Integration Tests
      run: dotnet test tests/clvgr.IntegrationTests/clvgr.IntegrationTests.csproj -c Release --no-build
