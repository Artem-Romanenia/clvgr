syntax = "proto3";
option csharp_namespace = "clvgr.Models";

message AdditionalField {
  string name = 1;
  oneof value {
    string openValue = 2;
    bytes secretValue = 3;
  };
}

message Resource {
  string resourceName = 1;
  bytes secret = 2;
  string shortName = 3;
  string url = 4;
  repeated string tags = 5;
  repeated AdditionalField fields = 6;
}

message SecretsFilePayload {
  repeated Resource Secrets = 1;
}
